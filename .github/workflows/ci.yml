name: CI
on: [push, pull_request]
jobs:
  engine:
    runs-on: ubuntu-latest
    strategy:
      matrix: { cc: [gcc, clang] }
    steps:
      - uses: actions/checkout@v4
      - name: Build DSP engine (${{ matrix.cc }}, warnings are errors)
        run: make -C engine CC=${{ matrix.cc }} CFLAGS="-O2 -ffast-math -fno-finite-math-only -Werror"
      - name: DSP test suite (44.1/48/96/192 kHz)
        run: make -C engine test CC=${{ matrix.cc }}
  python:
    name: python (${{ matrix.python }}, Qt ${{ matrix.qt }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
        qt: ["latest"]
        runner: [ubuntu-24.04]
        include:
          - { python: "3.12", qt: "6.7.3", runner: ubuntu-24.04 }
          - { python: "3.12", qt: "latest", runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Install Qt runtime libraries
        timeout-minutes: 5
        run: |
          # Avoid stalled Azure mirrors while retaining Ubuntu's signed repositories.
          if [[ "$RUNNER_ARCH" == X64 ]]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends libegl1 libopengl0 libatomic1
      - name: Install Python dependencies
        env: { QT_VERSION: "${{ matrix.qt }}" }
        run: |
          if [[ "$QT_VERSION" == latest ]]; then
            pip install numpy PySide6
          else
            pip install numpy "PySide6==$QT_VERSION"
          fi
      - name: Verify Qt runtime and architecture
        env: { QT_VERSION: "${{ matrix.qt }}" }
        run: |
          python - <<'PY'
          import os, platform
          from PySide6.QtCore import qVersion
          print("Qt", qVersion(), "architecture", platform.machine())
          if os.environ["QT_VERSION"] != "latest":
              assert qVersion() == os.environ["QT_VERSION"]
          if os.environ["RUNNER_ARCH"] == "ARM64":
              assert platform.machine() in ("aarch64", "arm64")
          PY
      - name: Native ARM64 DSP build and tests
        if: matrix.runner == 'ubuntu-24.04-arm'
        run: make -C engine test CC=gcc CFLAGS="-O2 -ffast-math -fno-finite-math-only -Werror"
      - name: Compile check
        run: python -m py_compile app/main.py app/resona/*.py packaging/install.py tests/*.py
      - name: Unit tests
        run: |
          python tests/test_units.py
          python tests/test_persistence.py
          python tests/test_updater.py
          python tests/test_release.py
          python tests/test_install.py
          python tests/test_backend.py
          python tests/test_pipeline.py
          python tests/test_correction.py
          python tests/test_shm.py
          python tests/test_validation.py
          python tests/test_desktop.py
          PYTHONPATH=tests python -m unittest test_updates test_ipc test_qml
          PYTHONPATH=tests python -m unittest test_qml test_ipc test_updates
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DSP tests with address and undefined-behavior sanitizers
        run: >-
          make -C engine test CC=clang
          CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
          TEST_CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
  attestation:
    if: github.repository == 'noble6/resona' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - name: Package source for verification smoke test
        run: git archive --format=tar --prefix=resona-ci/ "$GITHUB_SHA" | gzip -n > source.tar.gz
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with: { subject-path: source.tar.gz }
      - name: Verify signature and reject non-release identity
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          PYTHONPATH: app
        run: |
          gh attestation verify source.tar.gz --bundle "$BUNDLE" --hostname github.com \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/heads/main" \
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          python3 - <<'PY'
          import os
          from pathlib import Path
          from resona import release
          archive, bundle = release.urls('v0.0.0')
          info = dict(tag='v0.0.0', version='0.0.0', commit=os.environ['GITHUB_SHA'], tarball=archive, attestation=bundle)
          try:
              release.verify(Path('source.tar.gz'), Path(os.environ['BUNDLE']), info)
          except RuntimeError:
              print('Valid CI signature correctly rejected by release-only policy')
          else:
              raise AssertionError('Non-release identity accepted')
          PY
  pipewire:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install PipeWire and Qt runtime libraries
        timeout-minutes: 5
        run: |
          # Avoid stalled Azure mirrors while retaining Ubuntu's signed repositories.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends pipewire pipewire-pulse wireplumber pulseaudio-utils libegl1 libopengl0
      - run: pip install numpy PySide6
      - run: make -C engine
      - name: Live tests on isolated PipeWire server
        run: python tests/test_pipewire_environment.py
