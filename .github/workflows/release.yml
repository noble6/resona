name: Attested release source
on:
  release:
    types: [published]
concurrency:
  group: release-source-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'noble6/resona' && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and source version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import ast, os, re
          from pathlib import Path
          tag = os.environ['TAG']
          assert re.fullmatch(r'[vV]?\d+\.\d+\.\d+', tag), 'Expected a stable version tag'
          tree = ast.parse(Path('app/resona/__init__.py').read_text())
          versions = [ast.literal_eval(node.value) for node in tree.body if isinstance(node, ast.Assign)
                      and any(isinstance(target, ast.Name) and target.id == '__version__' for target in node.targets)]
          assert versions == [tag.lstrip('vV')], 'Tag and source version differ'
          PY
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"
          printf 'ASSET=resona-%s.tar.gz\n' "$TAG" >> "$GITHUB_ENV"
      - name: Package exact source commit
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: git archive --format=tar --prefix="resona-$TAG/" "$GITHUB_SHA" | gzip -n > "$ASSET"
      - name: Attest source archive
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}
      - name: Verify and publish attested source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "$ASSET.sigstore.json"
          gh attestation verify "$ASSET" --bundle "$ASSET.sigstore.json" --hostname github.com \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$TAG" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --source-ref "refs/tags/$TAG" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          gh release upload "$TAG" "$ASSET" "$ASSET.sigstore.json" --repo "$GITHUB_REPOSITORY" --clobber
